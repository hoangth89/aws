name: Node CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      # GitHub OIDC → AWS IAM Role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::749203477175:role/GitHubActionsECRRole
          aws-region: ap-southeast-2

      # Login Docker → ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/learning-aws:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/learning-aws:latest .

      # Push image → ECR
      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/learning-aws:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/learning-aws:latest